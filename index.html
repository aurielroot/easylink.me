<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javahir | EasyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(to bottom, #0c1445 0%, #1a237e 50%, #283593 100%);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in-down {
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .link-card {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .link-card:hover {
            transform: translateY(-4px) scale(1.01);
        }
        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: #e2e8f0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .shooting-star {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffffff;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 15px #93c5fd);
            opacity: 0;
        }
        
        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 90%;
            width: 250px;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(147, 197, 253, 0.3) 40%, rgba(255, 255, 255, 0.8) 80%, #ffffff 100%);
            transform: translateY(-50%);
            border-radius: 2px;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 90%;
            width: 180px;
            height: 10px;
            background: linear-gradient(90deg, transparent 0%, rgba(147, 197, 253, 0.15) 50%, rgba(255, 255, 255, 0.5) 100%);
            transform: translateY(-50%);
            filter: blur(5px);
            border-radius: 10px;
        }
        
        .shooting-star:nth-child(1) {
            top: -20px;
            left: 20%;
            animation: shoot1 8s infinite ease-in;
            animation-delay: 0s;
        }
        
        .shooting-star:nth-child(2) {
            top: -20px;
            left: 60%;
            animation: shoot2 11s infinite ease-in;
            animation-delay: 3.5s;
        }
        
        .shooting-star:nth-child(3) {
            top: -20px;
            left: 85%;
            animation: shoot3 13s infinite ease-in;
            animation-delay: 7s;
        }
        
        @keyframes shoot1 {
            0% { 
                transform: translate(0, 0) rotate(35deg); 
                opacity: 0; 
            }
            5% { opacity: 1; }
            70% { opacity: 1; }
            100% { 
                transform: translate(300px, 800px) rotate(35deg); 
                opacity: 0; 
            }
        }
        
        @keyframes shoot2 {
            0% { 
                transform: translate(0, 0) rotate(25deg); 
                opacity: 0; 
            }
            5% { opacity: 1; }
            70% { opacity: 1; }
            100% { 
                transform: translate(200px, 900px) rotate(25deg); 
                opacity: 0; 
            }
        }
        
        @keyframes shoot3 {
            0% { 
                transform: translate(0, 0) rotate(40deg); 
                opacity: 0; 
            }
            5% { opacity: 1; }
            70% { opacity: 1; }
            100% { 
                transform: translate(400px, 850px) rotate(40deg); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-start py-8 sm:py-12 px-4 sm:px-6 relative overflow-x-hidden">

    <div class="shooting-star pointer-events-none z-0"></div>
    <div class="shooting-star pointer-events-none z-0"></div>
    <div class="shooting-star pointer-events-none z-0"></div>

    <div class="flex flex-col items-center mb-8 sm:mb-10 z-10 animate-fade-in-down">
        <img src="https://github.com/yusf.png" alt="Yusf" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover ring-4 ring-white/20 shadow-2xl mb-4 bg-slate-800" onerror="this.style.display='none'">
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Javahir</h1>
        <p class="text-blue-100/80 mt-2 text-center max-w-xs text-sm sm:text-base">
            Becoming.
        </p>
    </div>

    <div id="links-container" class="w-full max-w-md space-y-4 sm:space-y-5 z-10">
        <div class="text-center text-blue-200/60 py-10" id="loading-text">
            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
        </div>
    </div>

    <footer class="mt-12 sm:mt-16 mb-6 text-center z-10 animate-fade-in-up" style="animation-delay: 1s;">
        <p class="text-blue-200/50 text-xs sm:text-sm tracking-wide">
            <span class="font-semibold text-blue-100/70">easylink.me</span> by 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-cyan-200 font-bold">Aurion</span>
        </p>
    </footer>

    <script>
        function createStars() {
            const starCount = 150;
            const body = document.body;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star pointer-events-none z-0';
                
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                
                body.appendChild(star);
            }
        }
        
        createStars();

        fetch('links.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('links-container');
                const loadingText = document.getElementById('loading-text');
                loadingText.style.display = 'none';

                data.forEach((link, index) => {
                    const delay = 0.2 + (index * 0.1); 

                    const cardHTML = `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                           class="link-card animate-fade-in-up group relative block w-full" 
                           style="animation-delay: ${delay}s;">
                           
                            <div class="absolute inset-0 bg-gradient-to-r ${link.gradient} opacity-20 blur-2xl rounded-2xl group-hover:opacity-30 transition-opacity duration-500"></div>
                            
                            <div class="relative flex items-center w-full p-4 sm:p-5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 shadow-xl group-hover:border-white/30 group-hover:bg-white/15 transition-all duration-300 overflow-hidden">
                                
                                <div class="flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br ${link.gradient} shadow-lg mr-4 z-10">
                                    <i class="${link.icon} text-white text-xl sm:text-2xl"></i>
                                </div>

                                <div class="flex flex-col z-10">
                                    <span class="font-semibold text-white text-base sm:text-lg">${link.platform}</span>
                                    <span class="text-blue-100/70 text-xs sm:text-sm">${link.username}</span>
                                </div>

                                <div class="ml-auto z-10 text-blue-200/60 transition-all duration-300 arrow-icon">
                                    <i class="fa-solid fa-arrow-right text-sm sm:text-base"></i>
                                </div>
                            </div>
                        </a>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            })
            .catch(error => {
                console.error('Error fetching JSON:', error);
                document.getElementById('loading-text').innerText = 'Failed to load links.';
            });
    </script>
</body>
</html>
