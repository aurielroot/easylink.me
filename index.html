<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusf | EasyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in-down {
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .link-card {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .link-card:hover {
            transform: translateY(-4px) scale(1.01);
        }
        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: white;
        }
        
        .glow-purple { filter: blur(100px); }
        .glow-blue { filter: blur(100px); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-slate-900 to-black text-white flex flex-col items-center justify-start py-8 sm:py-12 px-4 sm:px-6 relative overflow-x-hidden">

    <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full glow-purple pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-600/20 rounded-full glow-blue pointer-events-none"></div>

    <div class="flex flex-col items-center mb-8 sm:mb-10 z-10 animate-fade-in-down">
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Yusf</h1>
        <p class="text-gray-400 mt-2 text-center max-w-xs text-sm sm:text-base">
            Developer, designer, and tech enthusiast. All my links are below.
        </p>
    </div>

    <div id="links-container" class="w-full max-w-md space-y-4 sm:space-y-5 z-10">
        <div class="text-center text-gray-500 py-10" id="loading-text">
            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
        </div>
    </div>

    <footer class="mt-12 sm:mt-16 mb-6 text-center z-10 animate-fade-in-up" style="animation-delay: 1s;">
        <p class="text-gray-500 text-xs sm:text-sm tracking-wide">
            <span class="font-semibold text-gray-300">easylink.me</span> by 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 font-bold">Aurion</span>
        </p>
    </footer>

    <script>
        fetch('links.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('links-container');
                const loadingText = document.getElementById('loading-text');
                loadingText.style.display = 'none';

                data.forEach((link, index) => {
                    const delay = 0.2 + (index * 0.1); 

                    const cardHTML = `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                           class="link-card animate-fade-in-up group relative block w-full" 
                           style="animation-delay: ${delay}s;">
                           
                            <div class="absolute inset-0 bg-gradient-to-r ${link.gradient} opacity-20 blur-xl rounded-2xl group-hover:opacity-40 transition-opacity duration-500"></div>
                            
                            <div class="relative flex items-center w-full p-4 sm:p-5 rounded-2xl bg-gray-900/70 backdrop-blur-xl border border-white/10 shadow-xl group-hover:border-white/25 group-hover:bg-gray-900/80 transition-all duration-300 overflow-hidden">
                                
                                <div class="flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br ${link.gradient} shadow-md mr-4 z-10">
                                    <i class="${link.icon} text-white text-xl sm:text-2xl"></i>
                                </div>

                                <div class="flex flex-col z-10">
                                    <span class="font-semibold text-white text-base sm:text-lg">${link.platform}</span>
                                    <span class="text-gray-400 text-xs sm:text-sm">${link.username}</span>
                                </div>

                                <div class="ml-auto z-10 text-gray-500 transition-all duration-300 arrow-icon">
                                    <i class="fa-solid fa-arrow-right text-sm sm:text-base"></i>
                                </div>
                            </div>
                        </a>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            })
            .catch(error => {
                console.error('Error fetching JSON:', error);
                document.getElementById('loading-text').innerText = 'Failed to load links.';
            });
    </script>
</body>
</html>
